function listen(c){if(chans[c])return;chans[c]=sb.channel('docs-'+c).on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'col=eq.'+c},p=>{if(p.eventType==='DELETE')hubEmit(c,'del',p.old.id);else hubEmit(c,'set',p.new.id,p.new.data);}).subscribe();}
const dbx={
 collection:c=>({onSnapshot:(cb,eb)=>{const m=new Map(),emit=()=>cb({docs:[...m.entries()].map(([id,d])=>({id,data:()=>d}))});
  hubOn(c,(t,id,d)=>{t==='del'?m.delete(id):m.set(id,d);emit();});
  sb.from('docs').select('id,data').eq('col',c).range(0,4999).then(({data,error})=>{if(error){eb&&eb(sbErr(error));return;}data.forEach(r=>m.set(r.id,r.data));emit();});listen(c);}}),
 doc:path=>{const[c,i]=path.split('/');return{
  onSnapshot:(cb,eb)=>{let cur=null;const emit=()=>cb({exists:cur!==null,data:()=>cur||{}});
   hubOn(c,(t,id,d)=>{if(id!==i)return;cur=t==='del'?null:d;emit();});
   sb.from('docs').select('data').eq('col',c).eq('id',i).maybeSingle().then(({data,error})=>{if(error){eb&&eb(sbErr(error));return;}cur=data?data.data:null;emit();});listen(c);},
  set:async d=>{const{error}=await sb.from('docs').upsert({col:c,id:i,data:d});if(error)throw sbErr(error);hubEmit(c,'set',i,d);},
  delete:async()=>{const{error}=await sb.from('docs').delete().eq('col',c).eq('id',i);if(error)throw sbErr(error);hubEmit(c,'del',i);}}}};
const AU={mode:'in',msg:'',ok:false,busy:false,ext:{},n:'',e:'',cd:0};
fetch(SB_URL+'/auth/v1/settings',{headers:{apikey:SB_KEY}}).then(r=>r.json()).then(j=>{AU.ext=(j&&j.external)||{};if(AU.mode!=='sent'&&$('#ae'))authView();}).catch(()=>{});
function authView(){const up=AU.mode==='up',hd=`<div style="margin-top:8px;color:var(--fg)"><h1 style="margin:0">${LOGO(48)}</h1></div>`,m=`<p class="${AU.ok?'m':'er'}" role="alert">${E(AU.msg)}</p>`;
 if(AU.mode==='sent')return void($('#app').innerHTML=`<div class="col">${hd}<h2 class="ht">Confirme seu e-mail</h2><p>Enviamos um link para <b>${E(AU.e)}</b>. Abra o e-mail e toque no link para ativar sua conta. Depois volte aqui e entre.</p><p class="m">Não achou? Olhe também a caixa de spam.</p>${m}<button class="b" data-au="resend" ${AU.busy||AU.cd>0?'disabled':''}>${AU.busy?'Enviando…':AU.cd>0?'Reenviar em '+AU.cd+' s':'Reenviar e-mail'}${I('send')}</button><button class="g" data-au="tologin">Já confirmei, quero entrar</button></div>`);
 $('#app').innerHTML=`<div class="col">${hd}<p class="m">${up?'Crie sua conta para avaliar discos e seguir amigos.':'Entre para ver as reviews da sua rede.'}</p>
 ${up?`<div class="f">${I('user')}<input id="an" maxlength="80" autocomplete="name" aria-label="Nome completo" placeholder="Nome completo" value="${E(AU.n)}"></div>`:''}
 <div class="f">${I('chat')}<input id="ae" type="email" inputmode="email" autocomplete="email" autocapitalize="none" aria-label="E-mail" placeholder="E-mail" value="${E(AU.e)}"></div>
 <div class="f">${I('lock')}<input id="ap" type="password" autocomplete="${up?'new-password':'current-password'}" aria-label="Senha" placeholder="${up?'Senha (mínimo 8 caracteres)':'Senha'}"></div>
 ${up?`<div class="f">${I('lock')}<input id="ap2" type="password" autocomplete="new-password" aria-label="Repita a senha" placeholder="Repita a senha"></div>`:''}
 ${m}
 <button class="b" data-au="go" ${AU.busy?'disabled':''}>${AU.busy?'Aguarde…':up?'Criar conta':'Entrar'}${I('arrow')}</button>
 ${up?'':'<button class="lk m" style="justify-content:center" data-au="forgot">Esqueci minha senha</button>'}
 <button class="g" data-au="mode">${up?'Já tenho conta':'Criar uma conta'}</button>
 ${[['google','Google'],['facebook','Facebook']].some(([k])=>AU.ext[k])?'<p class="m" style="text-align:center">ou</p>':''}${[['google','Google'],['facebook','Facebook']].filter(([k])=>AU.ext[k]).map(([k,l])=>`<button class="g" data-au="${k}"><svg class="bi" style="width:22px;height:22px" aria-hidden="true"><use href="#${k}"/></svg>Continuar com ${l}</button>`).join('')}</div>`;}
const AUMSG={'Invalid login credentials':'Não foi possível entrar. Confira o e-mail e a senha.','User already registered':'Esse e-mail já tem conta. Toque em "Já tenho conta".','Email not confirmed':'Confirme seu e-mail pelo link que enviamos e tente de novo.'};
const auErr=m=>AUMSG[m]||(/rate limit/i.test(m)?'Muitos e-mails enviados. Aguarde alguns minutos e tente de novo.':/sending .*email/i.test(m)?'Não foi possível enviar o e-mail de confirmação. Tente de novo em alguns minutos.':'Não foi possível continuar ('+m+').');
function auSent(msg){AU.mode='sent';AU.ok=true;AU.msg=msg||'';AU.cd=60;authView();const t=setInterval(()=>{AU.cd--;if(AU.mode!=='sent'||AU.cd<=0){clearInterval(t);AU.cd=Math.max(0,AU.cd);}if(AU.mode==='sent')authView();},1000);}
async function authGo(){const up=AU.mode==='up',n=up?($('#an').value||'').trim().replace(/\s+/g,' '):'',e=($('#ae').value||'').trim(),p=$('#ap').value||'',p2=up?$('#ap2').value||'':'';AU.n=n||AU.n;AU.e=e;AU.ok=false;
 if(up&&n.split(' ').filter(x=>x.length>1).length<2){AU.msg='Digite seu nome completo (nome e sobrenome).';authView();return;}
 if(!/^\S+@\S+\.\S+$/.test(e)){AU.msg='Digite um e-mail válido.';authView();return;}
 if(up&&p.length<8){AU.msg='A senha precisa ter pelo menos 8 caracteres.';authView();return;}
 if(!p){AU.msg='Digite sua senha.';authView();return;}
 if(up&&p!==p2){AU.msg='As senhas não são iguais.';authView();return;}
 AU.busy=true;AU.msg='';authView();
 const r=up?await sb.auth.signUp({email:e,password:p,options:{data:{full_name:n},emailRedirectTo:location.origin}}):await sb.auth.signInWithPassword({email:e,password:p});
 AU.busy=false;
 if(r.error){if(!up&&r.error.message==='Email not confirmed'){auSent('Sua conta ainda não foi confirmada. Use o link que enviamos ou peça um novo.');return;}AU.msg=auErr(r.error.message);authView();return;}
 if(up&&r.data.user&&Array.isArray(r.data.user.identities)&&!r.data.user.identities.length){AU.mode='in';AU.msg='Esse e-mail já tem conta. Entre com sua senha.';authView();return;}
 if(r.data.session){if(!r.data.session.user.email_confirmed_at){AU.quiet=true;await sb.auth.signOut();auSent('Confirme seu e-mail para continuar.');return;}boot(r.data.session);return;}
 auSent('Conta criada. Falta só confirmar o e-mail.');}
async function auResend(){if(AU.cd>0||AU.busy)return;AU.busy=true;AU.msg='';authView();
 const r=await sb.auth.resend({type:'signup',email:AU.e,options:{emailRedirectTo:location.origin}});AU.busy=false;
 if(r.error){AU.ok=false;AU.msg=auErr(r.error.message);AU.cd=0;authView();return;}
 auSent('E-mail reenviado. Pode levar alguns minutos.');}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-au]');if(!b)return;const a=b.dataset.au;
 if(a==='google'||a==='facebook'){const nm={google:'Google',facebook:'Facebook'}[a];sb.auth.signInWithOAuth({provider:a,options:{redirectTo:location.origin}}).then(r=>{if(r.error){AU.ok=false;AU.msg='Não foi possível entrar com '+nm+'.';authView();}});return;}
 if(a==='forgot'){const e=(($('#ae')||{}).value||'').trim();AU.e=e;AU.ok=false;if(!/^\S+@\S+\.\S+$/.test(e)){AU.msg='Digite seu e-mail e toque em Esqueci minha senha.';authView();return;}AU.busy=true;sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin}).then(r=>{AU.busy=false;AU.ok=!r.error;AU.msg=r.error?auErr(r.error.message):'Se esse e-mail tem conta, enviamos um link para criar uma senha nova. Olhe também o spam.';authView();});return;}
 if(a==='mode'){AU.n=($('#an')||{}).value||AU.n;AU.e=($('#ae')||{}).value||AU.e;AU.mode=AU.mode==='up'?'in':'up';AU.msg='';AU.ok=false;authView();}
 else if(a==='resend')auResend();else if(a==='tologin'){AU.mode='in';AU.msg='';AU.ok=false;authView();}else authGo();});
document.addEventListener('keydown',ev=>{const id=ev.target.id||'';if(ev.key==='Enter'&&['an','ae','ap','ap2'].includes(id))authGo();else if(ev.key==='Enter'&&['n','h'].includes(id)&&!D.pro[me])act('setup');else if(ev.key==='Enter'&&id.startsWith('wl-'))act('wnext');else if(ev.key==='Enter'&&['rp1','rp2'].includes(id))act('recset');else if(ev.key==='Escape'&&S.tour!=null)act('tskip');});
function boot(session){if(!session.user.email_confirmed_at){AU.quiet=true;sb.auth.signOut().then(()=>{AU.e=session.user.email||'';auSent('Confirme seu e-mail para continuar.');});return;}S.su.n=(session.user.user_metadata||{}).full_name||'';user={id:async()=>session.user.id,can:async()=>true};db=dbx;me=session.user.id;
 [['catalog','cat'],['profiles','pro'],['reviews','rev'],['comments','com'],['likes','lik'],['follows','fol'],['saved','sav'],['settings','set'],['market','mkt']].forEach(([c,k])=>sub(c,k));
 setTimeout(()=>{if(!L.pro||!L.cat){S.lt=1;render();}},9000);
 xback();psync();S.nu=location.search&&/[?&](seg|notif)=/.test(location.search)?location.search:null;if(S.nu)history.replaceState(null,'',location.pathname);
 db.doc('history/'+me).onSnapshot(d=>{D.his=d.exists?d.data():{};render();},()=>{});db.doc('playlists/'+me).onSnapshot(d=>{D.pls=d.exists?d.data():{};render();},()=>{});}
if(/type=recovery/.test(location.hash))S.rec=1;
(async()=>{if(!window.supabase){$('#app').innerHTML='<p class="m">Não foi possível carregar o app. Verifique sua conexão e recarregue.</p>';return;}
 const{data:{session}}=await sb.auth.getSession();if(session)boot(session);else authView();
 sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY'){S.rec=1;render();}if(ev==='SIGNED_OUT'&&!AU.quiet)location.reload();});})();
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='nav'&&me){S.nu=e.data.url;render();}});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script></body></html>
