<style>
:root{--bg:#0D0D0D;--fg:#F2F2F0;--mut:#A3A3A0;--card:#171717;--in:#1E1E1E;--line:#2A2A2A;--l2:#3A3A3A;--ac:#D2704A;--on:#0D0D0D;--er:#FF8A7A;--star:#E3A66B;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 'DM Sans',system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;padding:20px 20px 100px}
#app>*{animation:inn .35s ease both}
h1,h2,h3{font-family:'Bricolage Grotesque','DM Sans',sans-serif;margin:0}h2{font-size:28px}h3{font-size:17px}p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;transition:transform .15s}button:active{transform:scale(.94)}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.g{background:var(--in);border:1px solid var(--l2);border-radius:999px;min-height:44px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500}
.g.on{background:var(--fg);color:var(--on);border-color:var(--fg)}
.ib{width:44px;padding:0;border-radius:50%}
.b{background:var(--fg);color:var(--on);border:0;border-radius:999px;height:52px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
input,select,textarea{width:100%;background:var(--in);border:1px solid var(--l2);border-radius:12px;min-height:52px;padding:0 16px}
textarea{resize:none;min-height:96px;padding:12px 16px}
.f{position:relative}.f>.ic{position:absolute;left:16px;top:15px;color:var(--mut)}.f input{padding-left:48px}
.seg{display:flex;background:var(--in);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;color:var(--mut);min-height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:500}
.seg .on{background:var(--fg);color:var(--on);flex:2.2}
.m{color:var(--mut);font-size:13px}.st{color:var(--star);font-weight:700}.er{color:var(--er);font-size:13px}
.k{background:var(--card);border-radius:16px;padding:14px;margin:14px 0;display:flex;flex-direction:column;gap:10px}
.r{display:flex;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:14px}
.lk{background:none;border:0;padding:0;text-align:left;display:flex;align-items:center;gap:12px;min-height:44px;width:100%}
.c{border-radius:8px;flex:none}.av{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--on);font-size:15px}
.hero{display:block;position:relative;width:100%;overflow:hidden;border:0;padding:16px;text-align:left;border-radius:16px 16px 0 0}
.hero i{position:absolute;border-radius:50%;background:rgba(0,0,0,.16)}
.hero h3{font-size:30px;line-height:1.05;max-width:70%;position:relative}.hero p{font-weight:500;margin-top:6px;position:relative}
.chip{position:absolute;left:16px;bottom:16px;background:var(--bg);color:var(--star);border-radius:999px;padding:6px 14px;font-weight:700;font-size:16px}
.bar{height:6px;border-radius:3px;background:var(--ac);transform-origin:left;animation:grow .8s ease both}.tr{height:6px;border-radius:3px;background:var(--line)}
.th{border-left:2px solid var(--line);padding-left:10px;display:flex;flex-direction:column;gap:8px}
.sb{background:none;border:0;font-size:36px;min-width:44px;min-height:44px;padding:0 2px;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{max-width:480px;margin:0 auto;height:76px;display:flex;justify-content:space-around;align-items:center}
nav button{background:none;border:0;color:var(--mut);min-height:44px;padding:0 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:500;font-size:12px}
nav .on{color:var(--ac);font-weight:700}nav .pl{background:var(--fg);color:var(--on);border-radius:999px;padding:0 18px;min-height:52px;font-weight:700}
a.g{color:var(--ac);border-color:var(--ac);text-decoration:none}
.toast{position:fixed;left:20px;right:20px;bottom:100px;max-width:440px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:12px;padding:14px;font-weight:700;text-align:center;animation:up .3s both;z-index:6}.bd{position:absolute;top:-2px;right:-2px;background:var(--fg);color:var(--on);border-radius:999px;min-width:18px;height:18px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}.trk{width:46px;height:26px;border-radius:999px;position:relative;flex:none}.kn{position:absolute;top:3px;width:20px;height:20px;border-radius:50%;transition:left .2s}.bi{width:28px;height:28px;flex:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.tabs{display:flex;border-bottom:1px solid var(--line)}.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;border-radius:0;margin-bottom:-1px;color:var(--mut);min-height:44px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px}.tabs .on{color:var(--fg);border-bottom-color:var(--ac);font-weight:700}
@keyframes inn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.55}}.bub{max-width:85%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.4;animation:up .3s ease both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.ht{font-size:24px}
.rk{font:800 28px/1.2 'Bricolage Grotesque','DM Sans',sans-serif;width:28px;flex:none}
.k,.rw{animation:up .4s ease both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

   sb.from('docs').select('data').eq('col',c).eq('id',i).maybeSingle().then(({data,error})=>{if(error){eb&&eb(sbErr(error));return;}cur=data?data.data:null;emit();});listen(c);},
  set:async d=>{const{error}=await sb.from('docs').upsert({col:c,id:i,data:d});if(error)throw sbErr(error);hubEmit(c,'set',i,d);},
  delete:async()=>{const{error}=await sb.from('docs').delete().eq('col',c).eq('id',i);if(error)throw sbErr(error);hubEmit(c,'del',i);}}}};
const AU={mode:'in',msg:'',ok:false,busy:false,ext:{},n:'',e:'',cd:0};
fetch(SB_URL+'/auth/v1/settings',{headers:{apikey:SB_KEY}}).then(r=>r.json()).then(j=>{AU.ext=(j&&j.external)||{};if(AU.mode!=='sent'&&$('#ae'))authView();}).catch(()=>{});
function authView(){const up=AU.mode==='up',hd=`<div style="margin-top:8px;color:var(--fg)"><h1 style="margin:0">${LOGO(48)}</h1></div>`,m=`<p class="${AU.ok?'m':'er'}" role="alert">${E(AU.msg)}</p>`;
 if(AU.mode==='sent')return void($('#app').innerHTML=`<div class="col">${hd}<h2 class="ht">Confirme seu e-mail</h2><p>Enviamos um link para <b>${E(AU.e)}</b>. Abra o e-mail e toque no link para ativar sua conta. Depois volte aqui e entre.</p><p class="m">Não achou? Olhe também a caixa de spam.</p>${m}<button class="b" data-au="resend" ${AU.busy||AU.cd>0?'disabled':''}>${AU.busy?'Enviando…':AU.cd>0?'Reenviar em '+AU.cd+' s':'Reenviar e-mail'}${I('send')}</button><button class="g" data-au="tologin">Já confirmei, quero entrar</button></div>`);
 $('#app').innerHTML=`<div class="col">${hd}<p class="m">${up?'Crie sua conta para avaliar discos e seguir amigos.':'Entre para ver as reviews da sua rede.'}</p>
 ${up?`<div class="f">${I('user')}<input id="an" maxlength="80" autocomplete="name" aria-label="Nome completo" placeholder="Nome completo" value="${E(AU.n)}"></div>`:''}
 <div class="f">${I('chat')}<input id="ae" type="email" inputmode="email" autocomplete="email" autocapitalize="none" aria-label="E-mail" placeholder="E-mail" value="${E(AU.e)}"></div>
 <div class="f">${I('lock')}<input id="ap" type="password" autocomplete="${up?'new-password':'current-password'}" aria-label="Senha" placeholder="${up?'Senha (mínimo 8 caracteres)':'Senha'}"></div>
 ${up?`<div class="f">${I('lock')}<input id="ap2" type="password" autocomplete="new-password" aria-label="Repita a senha" placeholder="Repita a senha"></div>`:''}
 ${m}
 <button class="b" data-au="go" ${AU.busy?'disabled':''}>${AU.busy?'Aguarde…':up?'Criar conta':'Entrar'}${I('arrow')}</button>
 <button class="g" data-au="mode">${up?'Já tenho conta':'Criar uma conta'}</button>
 ${[['google','Google'],['facebook','Facebook']].filter(([k])=>AU.ext[k]).map(([k,l])=>`<button class="g" data-au="${k}"><svg class="bi" style="width:22px;height:22px" aria-hidden="true"><use href="#${k}"/></svg>Continuar com ${l}</button>`).join('')}</div>`;}
const AUMSG={'Invalid login credentials':'E-mail ou senha incorretos.','User already registered':'Esse e-mail já tem conta. Toque em "Já tenho conta".','Email not confirmed':'Confirme seu e-mail pelo link que enviamos e tente de novo.'};
const auErr=m=>AUMSG[m]||(/rate limit/i.test(m)?'Muitos e-mails enviados. Aguarde alguns minutos e tente de novo.':/sending .*email/i.test(m)?'Não foi possível enviar o e-mail de confirmação. Tente de novo em alguns minutos.':'Não foi possível continuar ('+m+').');
function auSent(msg){AU.mode='sent';AU.ok=true;AU.msg=msg||'';AU.cd=60;authView();const t=setInterval(()=>{AU.cd--;if(AU.mode!=='sent'||AU.cd<=0){clearInterval(t);AU.cd=Math.max(0,AU.cd);}if(AU.mode==='sent')authView();},1000);}
async function authGo(){const up=AU.mode==='up',n=up?($('#an').value||'').trim().replace(/\s+/g,' '):'',e=($('#ae').value||'').trim(),p=$('#ap').value||'',p2=up?$('#ap2').value||'':'';AU.n=n||AU.n;AU.e=e;AU.ok=false;
 if(up&&n.split(' ').filter(x=>x.length>1).length<2){AU.msg='Digite seu nome completo (nome e sobrenome).';authView();return;}
 if(!/^\S+@\S+\.\S+$/.test(e)){AU.msg='Digite um e-mail válido.';authView();return;}
 if(up&&p.length<8){AU.msg='A senha precisa ter pelo menos 8 caracteres.';authView();return;}
 if(!p){AU.msg='Digite sua senha.';authView();return;}
 if(up&&p!==p2){AU.msg='As senhas não são iguais.';authView();return;}
 AU.busy=true;AU.msg='';authView();
 const r=up?await sb.auth.signUp({email:e,password:p,options:{data:{full_name:n},emailRedirectTo:location.origin}}):await sb.auth.signInWithPassword({email:e,password:p});
 AU.busy=false;
 if(r.error){if(!up&&r.error.message==='Email not confirmed'){auSent('Sua conta ainda não foi confirmada. Use o link que enviamos ou peça um novo.');return;}AU.msg=auErr(r.error.message);authView();return;}
 if(up&&r.data.user&&Array.isArray(r.data.user.identities)&&!r.data.user.identities.length){AU.mode='in';AU.msg='Esse e-mail já tem conta. Entre com sua senha.';authView();return;}
 if(r.data.session){if(!r.data.session.user.email_confirmed_at){AU.quiet=true;await sb.auth.signOut();auSent('Confirme seu e-mail para continuar.');return;}boot(r.data.session);return;}
 auSent('Conta criada. Falta só confirmar o e-mail.');}
async function auResend(){if(AU.cd>0||AU.busy)return;AU.busy=true;AU.msg='';authView();
 const r=await sb.auth.resend({type:'signup',email:AU.e,options:{emailRedirectTo:location.origin}});AU.busy=false;
 if(r.error){AU.ok=false;AU.msg=auErr(r.error.message);AU.cd=0;authView();return;}
 auSent('E-mail reenviado. Pode levar alguns minutos.');}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-au]');if(!b)return;const a=b.dataset.au;
 if(a==='google'||a==='facebook'){sb.auth.signInWithOAuth({provider:a,options:{redirectTo:location.origin}}).then(r=>{if(r.error){AU.ok=false;AU.msg='Não foi possível entrar com '+a+'.';authView();}});return;}
 if(a==='mode'){AU.n=($('#an')||{}).value||AU.n;AU.e=($('#ae')||{}).value||AU.e;AU.mode=AU.mode==='up'?'in':'up';AU.msg='';AU.ok=false;authView();}
 else if(a==='resend')auResend();else if(a==='tologin'){AU.mode='in';AU.msg='';AU.ok=false;authView();}else authGo();});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&['an','ae','ap','ap2'].includes(ev.target.id))authGo();});
function boot(session){if(!session.user.email_confirmed_at){AU.quiet=true;sb.auth.signOut().then(()=>{AU.e=session.user.email||'';auSent('Confirme seu e-mail para continuar.');});return;}S.su.n=(session.user.user_metadata||{}).full_name||'';user={id:async()=>session.user.id,can:async()=>true};db=dbx;me=session.user.id;
 [['catalog','cat'],['profiles','pro'],['reviews','rev'],['comments','com'],['likes','lik'],['follows','fol'],['saved','sav'],['settings','set'],['market','mkt']].forEach(([c,k])=>sub(c,k));
 db.doc('history/'+me).onSnapshot(d=>{D.his=d.exists?d.data():{};render();},()=>{});db.doc('playlists/'+me).onSnapshot(d=>{D.pls=d.exists?d.data():{};render();},()=>{});}
(async()=>{if(!window.supabase){$('#app').innerHTML='<p class="m">Não foi possível carregar o app. Verifique sua conexão e recarregue.</p>';return;}
 const{data:{session}}=await sb.auth.getSession();if(session)boot(session);else authView();
 sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT'&&!AU.quiet)location.reload();});})();
</script></body></html>
